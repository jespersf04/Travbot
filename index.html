<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080c14">
<title>TravBot</title>
<style>
  :root {
    --bg:#080c14;--card:#0e1420;--card2:#111827;--border:#1a2540;
    --accent:#00d4ff;--gold:#f5c842;--green:#22c55e;--red:#ef4444;
    --purple:#a78bfa;--orange:#f97316;--muted:#4a5568;--text:#e2e8f0;--textdim:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono','Courier New',monospace;min-height:100vh;padding-bottom:40px}

  .header{background:linear-gradient(180deg,#0c1628,#080c14);border-bottom:1px solid var(--border);padding:20px 16px 16px;text-align:center}
  .header-sub{font-size:9px;letter-spacing:5px;color:var(--accent);margin-bottom:4px}
  .header-title{font-size:28px;font-weight:900;letter-spacing:-1px}
  .header-desc{font-size:11px;color:var(--muted);margin-top:4px}

  .content{padding:16px 14px;max-width:480px;margin:0 auto}

  .error{background:#200a0a;border:1px solid rgba(239,68,68,.4);border-radius:10px;padding:12px;margin-bottom:14px;font-size:12px;color:#fca5a5;line-height:1.6}

  /* UPLOAD */
  .upload-zone{border:2px dashed rgba(0,212,255,.5);border-radius:16px;padding:44px 24px;text-align:center;cursor:pointer;background:rgba(0,212,255,.06);transition:all .2s}
  .upload-zone:active{background:rgba(0,212,255,.12)}
  .upload-icon{font-size:52px;margin-bottom:10px}
  .upload-title{font-size:17px;font-weight:800;margin-bottom:8px}
  .upload-desc{font-size:12px;color:var(--textdim);line-height:1.8;margin-bottom:16px}
  .upload-btn{background:var(--accent);color:#000;border-radius:10px;padding:12px 28px;font-weight:900;font-size:14px;display:inline-block}

  .tips{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px}
  .tips-title{font-size:10px;color:var(--gold);letter-spacing:2px;margin-bottom:10px}
  .tip-row{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--border)}
  .tip-icon{font-size:13px;flex-shrink:0}
  .tip-text{font-size:12px;color:var(--textdim);line-height:1.5}

  /* LOADING */
  .loading{text-align:center;padding:60px 20px}
  .loading-icon{font-size:44px;margin-bottom:12px;animation:spin 1.5s linear infinite;display:inline-block}
  .loading-text{color:var(--accent);font-size:12px;letter-spacing:3px;margin-bottom:6px}
  .loading-sub{color:var(--muted);font-size:11px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* RESULT */
  .result-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
  .result-label{font-size:9px;color:var(--muted);letter-spacing:2px}
  .result-name{font-size:17px;font-weight:800}
  .new-btn{background:none;border:1px solid var(--border);color:var(--textdim);border-radius:8px;padding:6px 12px;font-size:11px;cursor:pointer;font-family:inherit}

  /* FIELD STATS */
  .field-stats{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
  .section-label{font-size:10px;color:var(--accent);letter-spacing:2px;margin-bottom:10px}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
  .stat-label{font-size:11px;color:var(--textdim)}
  .stat-val{font-size:12px;font-weight:700}
  .weight-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .weight-label{font-size:10px;color:var(--textdim);min-width:90px}
  .bar-track{background:var(--border);border-radius:3px;height:5px;flex:1;overflow:hidden}
  .bar-fill{height:100%;border-radius:3px;transition:width 1s ease}
  .weight-pct{font-size:10px;font-weight:700;min-width:28px;text-align:right}

  /* HORSE CARD */
  .horse-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
  .horse-card.top{background:linear-gradient(135deg,#0d1f30,#091828);border-color:var(--accent);box-shadow:0 0 24px rgba(0,212,255,.1)}
  .horse-card.value{border-color:var(--green);box-shadow:0 0 16px rgba(34,197,94,.1)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;min-height:4px}
  .tag{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:1px}
  .horse-main{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .horse-left{display:flex;align-items:center;gap:10px}
  .horse-num{width:40px;height:40px;border-radius:50%;background:rgba(0,212,255,.15);border:2px solid rgba(0,212,255,.35);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:var(--accent);flex-shrink:0}
  .horse-name{font-weight:800;font-size:15px}
  .horse-driver{font-size:11px;color:var(--textdim);margin-top:2px}
  .horse-odds{font-size:26px;font-weight:900;line-height:1}
  .odds-label{font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:2px;text-align:right}
  .score-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .score-label{font-size:10px;color:var(--muted);min-width:44px}
  .score-val{font-size:13px;font-weight:900;min-width:30px;text-align:right}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat-box{background:var(--card2);border-radius:8px;padding:8px 10px}
  .stat-box-label{font-size:8px;color:var(--muted);letter-spacing:1px;margin-bottom:3px}
  .stat-box-val{font-size:14px;font-weight:800}
  .details{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;display:none}
  .details-title{font-size:10px;color:var(--accent);letter-spacing:2px;margin-bottom:8px}
  .benter-box{margin-top:10px;background:var(--card2);border-radius:8px;padding:10px}
  .benter-title{font-size:9px;color:var(--purple);letter-spacing:1px;margin-bottom:4px}
  .benter-text{font-size:11px;color:var(--textdim);line-height:1.6}
  .toggle-hint{text-align:center;margin-top:10px;font-size:10px;color:var(--muted)}

  /* AI */
  .ai-box{background:linear-gradient(135deg,#0a160a,#0d1a0d);border:1px solid rgba(34,197,94,.3);border-radius:14px;padding:16px;margin-top:14px}
  .ai-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .ai-title{font-size:10px;color:var(--green);letter-spacing:2px;font-weight:800}
  .ai-sub{font-size:10px;color:var(--muted);margin-top:2px}
  .ai-btn{background:var(--green);color:#000;border:none;border-radius:8px;padding:10px 20px;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit}
  .ai-btn:disabled{background:var(--muted);cursor:not-allowed}
  .ai-text{color:var(--text);font-size:13px;line-height:1.8;white-space:pre-wrap;border-top:1px solid var(--border);padding-top:12px}
  .ai-placeholder{color:var(--muted);font-size:12px}

  .info-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px}
  .info-title{font-size:9px;color:var(--purple);letter-spacing:2px;margin-bottom:6px}
  .info-text{font-size:11px;color:var(--textdim);line-height:1.7}

  .preview-thumb{width:100%;border-radius:10px;margin-bottom:14px;max-height:130px;object-fit:cover;object-position:top;opacity:.65}
</style>
</head>
<body>

<div class="header">
  <div class="header-sub">ATG TRAVANALYS · AI-DRIVEN</div>
  <div class="header-title">🏇 TRAVBOT</div>
  <div class="header-desc">Ta screenshot från ATG → få full analys direkt</div>
</div>

<div class="content" id="app"></div>

<script>
const API = window.location.origin;
let previewURL = null;

function oddsToImplied(o){return(1/parseFloat(o))*100}

function showError(msg){
  const app=document.getElementById("app");
  document.querySelectorAll(".error").forEach(e=>e.remove());
  const d=document.createElement("div");
  d.className="error";d.innerHTML="⚠️ "+msg;
  app.prepend(d);
}

// ── UPLOAD SCREEN ──────────────────────────────────────────────────────────
function renderUpload(){
  document.getElementById("app").innerHTML=`
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">📸</div>
      <div class="upload-title">Ladda upp ATG-screenshot</div>
      <div class="upload-desc">
        Öppna ATG-appen och ta en screenshot<br>
        på ett lopp med odds synliga.<br>
        <strong style="color:var(--gold)">Kan ladda upp flera bilder</strong>
      </div>
      <div class="upload-btn">VÄLJ BILD(ER)</div>
    </div>
    <div class="tips">
      <div class="tips-title">TIPS FÖR BÄSTA RESULTAT</div>
      <div class="tip-row"><span class="tip-icon">✅</span><span class="tip-text">Se till att hästarnas namn OCH odds syns tydligt</span></div>
      <div class="tip-row"><span class="tip-icon">✅</span><span class="tip-text">Ladda upp flera bilder om hela listan inte ryms</span></div>
      <div class="tip-row"><span class="tip-icon">✅</span><span class="tip-text">Fungerar med V75, V86, Vinnare – alla spelformer</span></div>
      <div class="tip-row"><span class="tip-icon">❌</span><span class="tip-text">Ta inte bild på TravBot, ta bild på ATG-appen</span></div>
    </div>
  `;
  document.getElementById("uploadZone").onclick=()=>document.getElementById("fileInput").click();
  document.getElementById("fileInput").onchange=e=>handleFiles(e.target.files);
}

// ── HANDLE FILES ───────────────────────────────────────────────────────────
async function handleFiles(files){
  if(!files||!files.length)return;
  previewURL=URL.createObjectURL(files[0]);

  document.getElementById("app").innerHTML=`
    <div class="loading">
      <div class="loading-icon">🔍</div>
      <div class="loading-text">LÄSER AV LOPPET...</div>
      <div class="loading-sub">AI analyserar hästar och odds</div>
    </div>`;

  // Send first image (or all if multiple)
  const formData=new FormData();
  formData.append("file", files[0]);

  try{
    const res=await fetch(`${API}/api/scan`,{method:"POST",body:formData});
    const data=await res.json();

    if(data.error){showError(data.error);renderUpload();return;}
    if(!data.horses||!data.horses.length){showError("Inga hästar hittades – försök med en tydligare bild.");renderUpload();return;}

    renderResult(data.raceName||"Lopp", data.horses);
  }catch(e){
    showError("Kunde inte analysera bilden. Kontrollera att ANTHROPIC_API_KEY är satt i Railway.");
    renderUpload();
  }
}

// ── RENDER RESULT ──────────────────────────────────────────────────────────
function renderResult(raceName, horses){
  horses.sort((a,b)=>parseFloat(a.odds)-parseFloat(b.odds));
  const allOdds=horses.map(h=>parseFloat(h.odds));
  const totalImplied=allOdds.reduce((s,o)=>s+oddsToImplied(o),0);
  const overround=(totalImplied-100).toFixed(1);
  const minOdds=Math.min(...allOdds);

  const valueHorses=horses.filter((h,i)=>{
    const impl=oddsToImplied(parseFloat(h.odds));
    const share=(impl/totalImplied)*100;
    return parseFloat(h.odds)>=5&&i>=1&&share<((horses.length-i)/horses.length)*45;
  });

  const app=document.getElementById("app");
  app.innerHTML="";

  // Preview
  if(previewURL){
    const img=document.createElement("img");
    img.src=previewURL;img.className="preview-thumb";
    app.appendChild(img);
  }

  // Header
  const hdr=document.createElement("div");
  hdr.className="result-header";
  const newBtn=document.createElement("button");
  newBtn.className="new-btn";newBtn.textContent="+ Nytt lopp";
  newBtn.onclick=()=>{previewURL=null;renderUpload();};
  hdr.innerHTML=`<div><div class="result-label">LOPP</div><div class="result-name">${raceName}</div></div>`;
  hdr.appendChild(newBtn);
  app.appendChild(hdr);

  // Field stats
  const fs=document.createElement("div");
  fs.className="field-stats";
  fs.innerHTML=`<div class="section-label">FÄLTÖVERSIKT</div>`;
  [
    ["Antal hästar",`${horses.length} st`,""],
    ["Poolöverrund",`+${overround}%`,"var(--gold)"],
    ["ATGs husandel","~25-30%","var(--red)"],
    ["Värdespel",valueHorses.length>0?`${valueHorses.length} st (${valueHorses.map(h=>"#"+h.number).join(", ")})`:"Inga",valueHorses.length>0?"var(--green)":"var(--textdim)"],
  ].forEach(([l,v,c])=>{
    fs.innerHTML+=`<div class="stat-row"><span class="stat-label">${l}</span><span class="stat-val" style="color:${c||"var(--text)"}">${v}</span></div>`;
  });
  fs.innerHTML+=`<div style="margin-top:12px;font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:8px">MODELLVIKTER</div>`;
  [["Spår/Fält",31,"var(--accent)"],["Bana/Distans",23,"var(--gold)"],["Kusk/Tränare",18,"var(--green)"],["Utrustning",15,"var(--orange)"],["Pooldynamik",13,"var(--purple)"]].forEach(([l,p,c])=>{
    fs.innerHTML+=`<div class="weight-row"><div class="weight-label">${l}</div><div class="bar-track"><div class="bar-fill" style="width:${(p/35)*100}%;background:${c}"></div></div><div class="weight-pct" style="color:${c}">${p}%</div></div>`;
  });
  app.appendChild(fs);

  // Horse cards
  horses.forEach((horse,rank)=>{
    const odds=parseFloat(horse.odds);
    const impl=oddsToImplied(odds);
    const share=(impl/totalImplied)*100;
    const isTop=odds===minOdds;
    const isValue=odds>=5&&rank>=1&&share<((horses.length-rank)/horses.length)*45;
    const score=Math.min(99,Math.round(((horses.length-rank)/horses.length)*65+Math.max(0,30-share)*0.8));
    const scoreColor=score>65?"var(--green)":score>40?"var(--gold)":"var(--red)";
    const oddsColor=odds<3?"var(--red)":odds>10?"var(--green)":"var(--gold)";

    const rankProb=((horses.length-rank)/horses.length)*0.7;
    const mktProb=impl/100;
    const logM=Math.log(Math.max(.001,mktProb)/Math.max(.001,1-mktProb));
    const logR=Math.log(Math.max(.001,rankProb)/Math.max(.001,1-rankProb));
    const blend=0.6*logR+0.4*logM;
    const benter=(1/(1+Math.exp(-blend))*100).toFixed(1);

    const card=document.createElement("div");
    card.className=`horse-card${isTop?" top":""}${isValue?" value":""}`;
    card.innerHTML=`
      <div class="tags">
        ${isTop?`<span class="tag" style="background:rgba(0,212,255,.15);color:var(--accent);border:1px solid rgba(0,212,255,.3)">FAVORIT</span>`:""}
        ${isValue?`<span class="tag" style="background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)">⭐ VÄRDESPEL?</span>`:""}
      </div>
      <div class="horse-main">
        <div class="horse-left">
          <div class="horse-num">${horse.number}</div>
          <div>
            <div class="horse-name">${horse.name}</div>
            <div class="horse-driver">🧑 ${horse.driver||"–"}</div>
          </div>
        </div>
        <div>
          <div class="horse-odds" style="color:${oddsColor}">${odds.toFixed(2)}</div>
          <div class="odds-label">V-ODDS</div>
        </div>
      </div>
      <div class="score-row">
        <div class="score-label">POÄNG</div>
        <div class="bar-track" style="flex:1"><div class="bar-fill" style="width:${score}%;background:${scoreColor}"></div></div>
        <div class="score-val" style="color:${scoreColor}">${score}</div>
      </div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-box-label">POOLANDEL</div><div class="stat-box-val" style="color:${share>50?"var(--red)":share>25?"var(--gold)":"var(--green)"}">${share.toFixed(1)}%</div></div>
        <div class="stat-box"><div class="stat-box-label">IMPLICIT</div><div class="stat-box-val">${impl.toFixed(1)}%</div></div>
        <div class="stat-box"><div class="stat-box-label">BENTER</div><div class="stat-box-val" style="color:var(--purple)">${benter}%</div></div>
      </div>
      <div class="details" id="det-${horse.number}">
        <div class="details-title">DETALJAD ANALYS</div>
        ${[["V-Odds",odds.toFixed(2),oddsColor],["Implicit chans",`${impl.toFixed(1)}%`,""],["Poolandel",`${share.toFixed(1)}%`,share>40?"var(--red)":"var(--green)"],["Benter-kalibrerad",`${benter}%`,"var(--purple)"],["Modellpoäng",`${score}/100`,scoreColor],["Värdebedömning",isValue?"✅ Underskattad":isTop&&odds<1.5?"⚠️ Överspelad?":"➖ Neutral",isValue?"var(--green)":isTop&&odds<1.5?"var(--gold)":"var(--textdim)"]].map(([l,v,c])=>`<div class="stat-row"><span class="stat-label">${l}</span><span class="stat-val" style="color:${c||"var(--text)"}">${v}</span></div>`).join("")}
        <div class="benter-box">
          <div class="benter-title">BENTER LOG-ODDS BLEND (α=0.6)</div>
          <div class="benter-text">Kombinerar modellens analys (60%) med marknadens poolodds (40%). Hästar där kalibrerad chans > poolandel = potentiellt värdespel.</div>
        </div>
      </div>
      <div class="toggle-hint" id="hint-${horse.number}">▼ Visa alla siffror</div>
    `;
    card.onclick=()=>{
      const d=document.getElementById(`det-${horse.number}`);
      const h=document.getElementById(`hint-${horse.number}`);
      const open=d.style.display==="block";
      d.style.display=open?"none":"block";
      h.textContent=open?"▼ Visa alla siffror":"▲ Dölj detaljer";
    };
    app.appendChild(card);
  });

  // AI Analysis
  const aiBox=document.createElement("div");
  aiBox.className="ai-box";
  aiBox.innerHTML=`
    <div class="ai-header">
      <div><div class="ai-title">🤖 AI-ANALYS</div><div class="ai-sub">Benter-kalibrerad · Värdebaserad</div></div>
      <button class="ai-btn" id="aiBtn">ANALYSERA</button>
    </div>
    <div id="aiOut" class="ai-placeholder">Tryck Analysera för rekommendationer.</div>
  `;
  app.appendChild(aiBox);

  document.getElementById("aiBtn").onclick=async function(){
    this.disabled=true;this.textContent="⏳ ANALYSERAR...";
    document.getElementById("aiOut").innerHTML=`<span style="color:var(--textdim);font-style:italic">Analyserar fältet...</span>`;
    const list=horses.map(h=>{
      const odds=parseFloat(h.odds);
      const impl=oddsToImplied(odds).toFixed(1);
      const share=((oddsToImplied(odds)/totalImplied)*100).toFixed(1);
      return `#${h.number} ${h.name} | Kusk: ${h.driver||"–"} | Odds: ${odds.toFixed(2)} | Implicit: ${impl}% | Poolandel: ${share}%`;
    }).join("\n");
    try{
      const res=await fetch(`${API}/api/analyze`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({raceName,horses:list})});
      const data=await res.json();
      document.getElementById("aiOut").className="ai-text";
      document.getElementById("aiOut").textContent=data.analysis;
      this.textContent="✓ KLAR";this.style.background="var(--muted)";
    }catch{
      document.getElementById("aiOut").textContent="Fel – kontrollera ANTHROPIC_API_KEY i Railway.";
      this.disabled=false;this.textContent="FÖRSÖK IGEN";
    }
  };

  app.innerHTML+=`
    <div class="info-box">
      <div class="info-title">OM MODELLEN</div>
      <div class="info-text">XGBoost pairwise ranking · Benter log-odds blend (α=0.6) · Modellvikter baserade på professionell travforskning. ⚠️ Spela alltid ansvarsfullt.</div>
    </div>`;
}

renderUpload();
</script>
</body>
</html>
